<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reservation Cart</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ee8c2b",
                        "background-light": "#f8f7f6",
                        "background-dark": "#221910",
                        "surface-light": "#ffffff",
                        "surface-dark": "#2f2216",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-50 font-display antialiased selection:bg-primary/30">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark overflow-hidden">
<!-- Header -->
<header class="flex items-center px-6 py-5 justify-between sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Reservation Cart</h2>
</header>
<!-- Main Content (Scrollable) -->
<main class="flex-1 flex flex-col px-4 pb-32 overflow-y-auto scrollbar-hide">
<!-- Cart Items List -->
<div class="flex flex-col gap-4 mt-2">
<!-- Item 1 -->
<div class="flex items-center gap-4 p-4 bg-surface-light dark:bg-surface-dark rounded shadow-sm border border-gray-100 dark:border-white/5">
<div class="shrink-0">
<div class="bg-center bg-no-repeat bg-cover rounded-lg size-20 shadow-inner" data-alt="Golden Retriever puppy sitting in grass" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA-OcC2z-vKRk3wXpK52IHSv12Z0vz4jfdYbBBfYiq63W7mLboV58GIGndydwWDtuXAi9TWS2vyMwxE98MIUyy_eBJF0oWDjSMPrCojxgdAkStSAJLBA3alUwnxYW2LjL8WJ4DHbVDq9x_JMCqu9M34XZnsVF-c3O70plug5TpiDkBNOvvRrNmHDzx9_huk24Qe2ASb2cxyZa_wyfBDEi9G2t5gu9qA-FTSDELgHQXsi5xfDVH7QfvLwyPxGrHCviHMI2TxmgAP8mk");'>
</div>
</div>
<div class="flex flex-col flex-1 min-w-0">
<div class="flex justify-between items-start mb-1">
<h3 class="text-base font-bold text-slate-900 dark:text-white truncate pr-2">Bella</h3>
<button class="text-slate-400 hover:text-red-500 transition-colors">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<p class="text-sm text-slate-500 dark:text-slate-400 font-medium mb-1">Golden Retriever Puppy</p>
<p class="text-primary font-bold text-sm">Deposit: $250.00</p>
</div>
</div>
<!-- Item 2 -->
<div class="flex items-center gap-4 p-4 bg-surface-light dark:bg-surface-dark rounded shadow-sm border border-gray-100 dark:border-white/5">
<div class="shrink-0">
<div class="bg-center bg-no-repeat bg-cover rounded-lg size-20 shadow-inner" data-alt="Siamese kitten looking curious" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuApk9FT7cW2ALamN0UWxIEGrijd7wJDERZIfkj3n4_WdScTjug69xdIq2numStgI5SJFcZE5GdsFKHh430q1TwC0FcWYxUuVVn5VXvvqjR6nggq2Ab-4FRvtiNQNFfsukmFGdjhiU0_b1X3xMDVVNmO0PG_Xi_26U8-Wkebw2-ZStAv9NJejQjQrR9eDVJL_n38qPizophk-7iGB6eQgWxKRvOmyaGcZh57MpzNIn1eNMuYwr65Ru4er0tDnFTgsKBsog36lir_tYQ");'>
</div>
</div>
<div class="flex flex-col flex-1 min-w-0">
<div class="flex justify-between items-start mb-1">
<h3 class="text-base font-bold text-slate-900 dark:text-white truncate pr-2">Luna</h3>
<button class="text-slate-400 hover:text-red-500 transition-colors">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<p class="text-sm text-slate-500 dark:text-slate-400 font-medium mb-1">Siamese Kitten</p>
<p class="text-primary font-bold text-sm">Deposit: $150.00</p>
</div>
</div>
</div>
<!-- Order Summary -->
<div class="mt-8 px-2">
<h4 class="text-slate-900 dark:text-white font-bold text-lg mb-4">Summary</h4>
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center text-sm">
<span class="text-slate-500 dark:text-slate-400">Subtotal</span>
<span class="text-slate-900 dark:text-slate-100 font-medium">$400.00</span>
</div>
<div class="flex justify-between items-center text-sm">
<span class="text-slate-500 dark:text-slate-400">Service Fee</span>
<span class="text-slate-900 dark:text-slate-100 font-medium">$20.00</span>
</div>
<div class="h-px bg-slate-200 dark:bg-white/10 my-1"></div>
<div class="flex justify-between items-center text-lg font-bold">
<span class="text-slate-900 dark:text-white">Total</span>
<span class="text-primary">$420.00</span>
</div>
</div>
</div>
<!-- Trust Badge -->
<div class="mt-8 flex flex-col items-center justify-center gap-2 opacity-80">
<div class="flex items-center gap-1.5 text-xs font-medium text-slate-500 dark:text-slate-400 bg-surface-light dark:bg-surface-dark px-3 py-1.5 rounded-full shadow-sm border border-slate-100 dark:border-white/5">
<span class="material-symbols-outlined text-[16px] text-green-600">verified_user</span>
<span>Secure transaction with Verified Sellers</span>
</div>
</div>
</main>
<!-- Floating Bottom Action -->
<div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark pt-12">
<button class="w-full bg-primary hover:bg-primary/90 active:scale-[0.98] transition-all text-white font-bold text-lg h-14 rounded-full shadow-lg shadow-primary/25 flex items-center justify-center gap-2">
<span>Proceed to Checkout</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</body></html>
