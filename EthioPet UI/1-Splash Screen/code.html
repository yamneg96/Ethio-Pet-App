<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PetConnect Splash Screen</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
            extend: {
                colors: {
                "primary": "#36e261",
                "background-light": "#f6f8f6",
                "background-dark": "#112115",
                },
                fontFamily: {
                "display": ["Plus Jakarta Sans"]
                },
                borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
            },
            },
        }
    </script>
<style>
        /* Custom override for the specific warm beige requested in the splash screen plan */
        .bg-warm-beige {
            background-color: #FAF8F1;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<!-- Splash Screen Container -->
<!-- Using bg-warm-beige for the specific design requirement, falling back to theme dark mode -->
<div class="relative flex h-screen w-full flex-col items-center justify-center overflow-hidden bg-warm-beige dark:bg-background-dark transition-colors duration-300">
<!-- Main Content Wrapper -->
<div class="flex flex-col items-center justify-center gap-6 p-6">
<!-- Logo Container -->
<div class="relative flex items-center justify-center">
<!-- Outer Glow/Shadow effect -->
<div class="absolute inset-0 rounded-full bg-primary blur-xl opacity-20"></div>
<!-- Icon Circle -->
<div class="relative flex h-36 w-36 items-center justify-center rounded-full bg-primary shadow-lg ring-4 ring-white/50 dark:ring-white/10">
<!-- Since we can't use a custom vector, we use a high-quality representation using Material Symbols or a placeholder image if needed. 
                         Given the constraints, a large icon is the cleanest vector-like solution. -->
<span class="material-symbols-outlined text-white text-[84px]">pets</span>
</div>
</div>
<!-- Text Content -->
<div class="flex flex-col items-center text-center space-y-2 mt-4">
<!-- App Name -->
<h1 class="text-[#0e1b11] dark:text-white text-4xl font-extrabold tracking-tight leading-tight">
                    PetConnect
                </h1>
<!-- Tagline -->
<p class="text-[#0e1b11]/70 dark:text-white/70 text-lg font-medium">
                    Trusted Pet Marketplace
                </p>
</div>
<!-- Loading Indicator (Subtle Spinner) -->
<div class="mt-8">
<div class="h-8 w-8 animate-spin rounded-full border-4 border-primary border-t-transparent"></div>
</div>
</div>
<!-- Footer / Language Selector -->
<div class="absolute bottom-10 right-8">
<button class="group flex items-center gap-2 rounded-full bg-white dark:bg-white/10 pl-3 pr-4 py-2.5 shadow-sm hover:shadow-md transition-all active:scale-95 ring-1 ring-black/5 dark:ring-white/10">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform text-[20px]">language</span>
<span class="text-sm font-bold text-[#0e1b11] dark:text-white">EN</span>
<span class="material-symbols-outlined text-[#0e1b11]/40 dark:text-white/40 text-[16px]">expand_more</span>
</button>
</div>
<!-- Decorative Background Elements (Subtle) -->
<div class="pointer-events-none absolute -top-20 -left-20 h-64 w-64 rounded-full bg-primary/5 blur-3xl"></div>
<div class="pointer-events-none absolute bottom-0 right-0 h-96 w-96 rounded-full bg-primary/5 blur-3xl translate-y-1/2 translate-x-1/2"></div>
</div>
</body></html>
