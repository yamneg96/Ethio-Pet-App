<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PetConnect Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#197fe6",
              "background-light": "#f6f7f8",
              "background-dark": "#111921",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 antialiased selection:bg-primary selection:text-white">
<div class="relative flex min-h-screen w-full flex-col overflow-hidden">
<!-- Top Navigation -->
<div class="flex items-center p-4 pb-2 justify-end">
<button class="flex items-center justify-center overflow-hidden rounded-lg h-10 w-10 text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined">language</span>
</button>
</div>
<!-- Main Content Scrollable Area -->
<div class="flex-1 flex flex-col items-center px-6 pt-4 pb-8 max-w-[480px] mx-auto w-full">
<!-- Branding Header -->
<div class="flex w-full flex-col gap-6 items-center mb-8">
<div class="flex flex-col items-center gap-4">
<div class="bg-center bg-no-repeat bg-cover rounded-full h-32 w-32 shadow-sm border-4 border-white dark:border-slate-800" data-alt="Minimalist logo illustration of a happy dog face" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAeMqrpgfYbt1ZRWa0bYXdXYaj2pC9o0QVKtFe996B-C764FS8Q4cA3WWfoCUKVoYnxGGAAt9SgIw3rKeKIpCR7i2KLqayHMQC3OoW2_Ia7fHOJsNaM2QcTFhFJzvT6sRhR1LewtPqujzahaf8mRBX4J0nq-yX0yZXyJBposrUw4QRA8-1v0Y1m-Dl2wmHEtNchT7TQ1kLVs5nQ4PdnGB7qfSCWiihT0506ODke6v0BES7B_iUBWqCOUiNjRICDcHUn_h_prB1l8Eg");'>
</div>
<div class="flex flex-col items-center justify-center text-center">
<h1 class="text-slate-900 dark:text-white text-3xl font-bold leading-tight tracking-tight">PetConnect</h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal mt-2">Welcome back, please login.</p>
</div>
</div>
</div>
<!-- Login Form -->
<div class="w-full flex flex-col gap-5">
<!-- Email/Phone Input -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-200 text-sm font-medium leading-normal">Email or Phone</label>
<input class="form-input flex w-full resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-transparent bg-white dark:bg-slate-800 focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 px-4 text-base font-normal leading-normal shadow-sm" placeholder="Enter email or phone number" type="text" value=""/>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-200 text-sm font-medium leading-normal">Password</label>
<div class="relative flex w-full items-center rounded-lg shadow-sm">
<input class="form-input flex w-full flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-transparent bg-white dark:bg-slate-800 focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 px-4 pr-12 text-base font-normal leading-normal" placeholder="Enter password" type="password" value=""/>
<button class="absolute right-0 flex items-center justify-center h-full px-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="text-primary hover:text-blue-600 dark:hover:text-blue-400 text-sm font-medium leading-normal" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 bg-primary hover:bg-blue-600 text-white gap-2 text-base font-bold leading-normal tracking-[0.015em] shadow-md shadow-blue-500/20 transition-all active:scale-[0.98]">
<span class="truncate">Login</span>
</button>
</div>
<!-- Footer / Sign Up -->
<div class="mt-auto pt-10 pb-4 flex flex-col items-center gap-6 w-full">
<!-- Trust Signal -->
<div class="flex items-center gap-2 text-slate-400 dark:text-slate-500 text-xs font-medium">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span>Verified &amp; Secure Marketplace</span>
</div>
<div class="h-px w-full bg-slate-200 dark:bg-slate-800"></div>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal text-center">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Create an account</a>
</p>
</div>
</div>
</div>
</body></html>
