<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PetConnect - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white dark:bg-slate-900 shadow-xl">
<!-- Top App Bar -->
<div class="flex items-center px-4 pt-4 pb-2 justify-between">
<button class="text-slate-900 dark:text-white flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<div class="flex items-center justify-end">
<button class="flex items-center justify-center rounded-xl h-10 px-3 bg-transparent text-slate-900 dark:text-white gap-2 text-base font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined">language</span>
<span class="text-sm">EN</span>
</button>
</div>
</div>
<!-- Scrollable Content -->
<div class="flex-1 flex flex-col px-6 pb-6">
<!-- Hero Section -->
<div class="pt-4 pb-6">
<h1 class="text-slate-900 dark:text-white tracking-tight text-[32px] font-extrabold leading-tight mb-2">Create account</h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-medium leading-normal">
                    Join our community to find your new best friend or find them a loving home.
                </p>
</div>
<!-- Role Selector -->
<div class="mb-6">
<div class="flex p-1 bg-slate-100 dark:bg-slate-800 rounded-xl relative">
<!-- Active Indicator Background (Visual only, would be positioned by JS in real app, hardcoded here for Buyer) -->
<div class="absolute top-1 left-1 bottom-1 w-[calc(50%-4px)] bg-white dark:bg-slate-700 rounded-lg shadow-sm border border-slate-200 dark:border-slate-600 transition-all"></div>
<label class="relative flex-1 text-center py-2.5 z-10 cursor-pointer">
<input checked="" class="peer hidden" name="role" type="radio" value="Buyer"/>
<span class="text-primary font-bold text-sm block">Buyer</span>
</label>
<label class="relative flex-1 text-center py-2.5 z-10 cursor-pointer">
<input class="peer hidden" name="role" type="radio" value="Seller"/>
<span class="text-slate-500 dark:text-slate-400 font-medium text-sm block peer-checked:text-primary peer-checked:font-bold">Seller</span>
</label>
</div>
<p class="text-xs text-slate-400 dark:text-slate-500 mt-2 pl-1 hidden peer-has-[:checked[value='Seller']]:block">
                    *Sellers require identity verification after signup.
                </p>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-4 mb-6">
<!-- Full Name -->
<div class="group">
<label class="block text-slate-900 dark:text-white text-sm font-semibold mb-2 ml-1">Full Name</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 material-symbols-outlined text-[20px]">person</span>
<input class="w-full bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3.5 pl-11 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all placeholder:text-slate-400" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Phone -->
<div class="group">
<label class="block text-slate-900 dark:text-white text-sm font-semibold mb-2 ml-1">Phone Number</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 material-symbols-outlined text-[20px]">call</span>
<input class="w-full bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3.5 pl-11 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all placeholder:text-slate-400" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- Email -->
<div class="group">
<label class="block text-slate-900 dark:text-white text-sm font-semibold mb-2 ml-1">Email Address</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 material-symbols-outlined text-[20px]">mail</span>
<input class="w-full bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3.5 pl-11 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all placeholder:text-slate-400" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="group">
<label class="block text-slate-900 dark:text-white text-sm font-semibold mb-2 ml-1">Password</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 material-symbols-outlined text-[20px]">lock</span>
<input class="w-full bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3.5 pl-11 pr-11 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all placeholder:text-slate-400" placeholder="Min. 8 characters" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mb-6">
<span>Create Account</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<!-- Divider -->
<div class="relative flex items-center gap-4 mb-6">
<div class="h-px bg-slate-200 dark:bg-slate-700 flex-1"></div>
<span class="text-xs font-medium text-slate-400 uppercase tracking-wide">Or sign up with</span>
<div class="h-px bg-slate-200 dark:bg-slate-700 flex-1"></div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-4 mb-8">
<button class="flex items-center justify-center gap-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl py-3 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
<img alt="Google Logo" class="w-5 h-5" data-alt="Google G logo in standard colors" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBLBN0jlhPssrY67EVO9Q5vehqZXh0N592SDCBUDqeXJBGPM05GPrkV-r6aURcfKl4FnEIZo6zksa8qBikCxbD__A_LprXXhU20HGxFh3KGVwM9mzSKwBFJAmJ6wgZPgZVjzFMxEkrnDhJxxnPO-570OhsFCt3D8xaxHzehJ01efwCYoI5C-q79Fpq1vFo_Mk-73Rblb15rTje4wZv5C6ssYYGd3e1tKacB2lCeXzvErqFbsiEQUEI-2JHXqmIew8SRuAaqNYJW_FQ"/>
<span class="text-slate-700 dark:text-slate-200 font-semibold text-sm">Google</span>
</button>
<button class="flex items-center justify-center gap-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl py-3 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
<span class="material-symbols-outlined text-[22px] text-black dark:text-white">desktop_mac</span>
<span class="text-slate-700 dark:text-slate-200 font-semibold text-sm">Apple</span>
</button>
</div>
<!-- Footer Link -->
<div class="mt-auto text-center pb-2">
<p class="text-slate-500 dark:text-slate-400 text-sm">
                    Already a member? 
                    <a class="text-primary font-bold hover:text-blue-600 transition-colors" href="#">Log in</a>
</p>
</div>
</div>
</div>
</body></html>
